[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-ai-automation-gateway"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "sqlalchemy>=2", "pydantic>=2", "httpx", "uvicorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
